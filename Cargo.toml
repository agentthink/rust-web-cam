[package]
name = "rustcam-media"
version = "0.1.0"
edition = "2021"
authors = ["RustCam Team"]
description = "Streaming media signaling management platform"

[lib]
name = "rustcam_media"
path = "src/lib.rs"

[[bin]]
name = "rustcam-media"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
axum = { version = "0.8.9", features = [
    "ws",       # WebSocket 支持
    "macros",   # debug_handler 等宏
    "tokio",    # tokio 运行时集成（必须！）
    "http1",    # HTTP/1.1 支持
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
reqwest = { version = "0.13.3", features = ["json", "query"] }
redis = { version = "1.6.0", features = ["tokio-comp", "connection-manager"] }
rbatis = { version = "4.9.7", features = ["debug_mode"] }
rbdc-pg = "4.9.6"
rbs = "4"
url = "2"
anyhow = "1.0.104"
thiserror = "2.0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-log = "0.2"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
config = "0.15.25"
futures-util = "0.3"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
hyper = "1.11.1"
hyper-util = { version = "0.1", features = ["tokio"] }
parking_lot = "0.12"
dashmap = "6.2.1"
once_cell = "1.19"
toml = "1.1.4+spec-1.1.0"
futures = "0.3.34"
rand = { version = "0.10", features = ["std", "std_rng", "thread_rng"] }
rand_core = "0.10"
getrandom = "0.2"
bytes = "1.12.1"

# JWT 认证
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }

# Casbin 权限
casbin = "2"

# 密码哈希
argon2 = "0.6.0"
password-hash = { version = "0.6", features = ["rand_core", "phc"] }

# 异步 trait
async-trait = "0.1.92"

# Regex for protocol matching
regex = "1.13.1"

# XML parsing
quick-xml = "0.42.0"
memchr = "2.8.3"
sha1 = "0.11.0"
base64 = "0.23.1"
md5 = "0.8.1"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.15.0"
[profile.dev]
opt-level = 0          # 禁止优化
debug = true           # 启用调试信息 (通常默认为 true)
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
